version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: quarterly
    groups:
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: quarterly
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
